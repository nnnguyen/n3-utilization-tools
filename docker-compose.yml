services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: n3-backend
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      DATABASE_URL: postgresql://utilization_tools:utilization_tools@postgres:5432/utilization_tools?schema=public
      PORT: 3000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      CREDENTIALS_KEY_PREVIOUS: ${CREDENTIALS_KEY_PREVIOUS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_SECURE: ${MAIL_SECURE:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      YOUTUBE_CALLBACK_URL: ${YOUTUBE_CALLBACK_URL:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YOUTUBE_OAUTH_TESTING_MODE: ${YOUTUBE_OAUTH_TESTING_MODE:-}
      YOUTUBE_TOKEN_WARN_AFTER_DAYS: ${YOUTUBE_TOKEN_WARN_AFTER_DAYS:-}
      YOUTUBE_QUOTA_LIMIT: ${YOUTUBE_QUOTA_LIMIT:-}
      YOUTUBE_MANUAL_UPLOAD_MAX_MB: ${YOUTUBE_MANUAL_UPLOAD_MAX_MB:-}
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      ZOOM_WEBHOOK_SECRET_TOKEN: ${ZOOM_WEBHOOK_SECRET_TOKEN:-}
      SYNC_SCHEDULER_ENABLED: ${SYNC_SCHEDULER_ENABLED:-}
      IP_RATE_LIMIT_WINDOW_MS: ${IP_RATE_LIMIT_WINDOW_MS:-}
      IP_RATE_LIMIT_MAX_PER_WINDOW: ${IP_RATE_LIMIT_MAX_PER_WINDOW:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: n3-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: n3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: utilization_tools
      POSTGRES_PASSWORD: utilization_tools
      POSTGRES_DB: utilization_tools
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U utilization_tools -d utilization_tools']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
